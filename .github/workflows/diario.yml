name: Precios diarios

on:
  schedule:
    - cron: "37 11 * * *"      # 6:37 a. m. hora de Colombia, todos los días
  workflow_dispatch:
    inputs:
      resumen:
        description: "Enviar también el resumen de la canasta a Telegram"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Recolectar precios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUMEN: ${{ github.event_name == 'workflow_dispatch' && inputs.resumen || '' }}
        run: python -m src.main

      - name: Guardar historial en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Precios del $(TZ=America/Bogota date +%F)"
          git pull --rebase -q && git push

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: sitio

  publicar:
    needs: precios
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true      # si GitHub Pages aún no está activado, no marca error
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
