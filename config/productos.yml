# Productos de la canasta que se comparan cada día.
#
# Campos de cada producto:
#   nombre:      cómo se muestra en la página y en Telegram
#   buscar:      texto que se escribe en el buscador de cada tienda
#   requiere:    palabras que DEBEN estar en el nombre del producto.
#                "a|b" = vale cualquiera de las dos. Termina en * para aceptar el inicio de palabra (huev* = huevo, huevos).
#   excluye:     palabras que descartan el producto (evita confundir "sal" con "salsa", etc.)
#   unidad:      kg, l o und. Se compara el precio por esta unidad, así importa poco el tamaño del paquete.
#   referencia:  cantidad que normalmente compras (para calcular el valor de la canasta)
#   rango:       [mínimo, máximo] de tamaño aceptado, en la unidad indicada
#
# Para agregar un producto, copia uno parecido y ajústalo.

- nombre: Arroz blanco
  buscar: arroz blanco
  requiere: [arroz]
  excluye: [integral, pollo, cocido, listo, harina, galleta, galletas, leche, vinagre, salsa, parboil, parboiled, sushi, basmati, jazmin, arborio, salvaje, snack, tortas, inflado, bebida]
